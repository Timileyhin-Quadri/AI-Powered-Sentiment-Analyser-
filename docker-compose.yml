services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: sentitrack-backend
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      - CHROME_CDP_PORT=9222
      - CHROME_PATH=/usr/bin/google-chrome-stable
    shm_size: '2gb' # Prevents Google Chrome headless tab crashes
    volumes:
      - x_session_data:/app/.x_session
      - ./cookies.json:/app/cookies.json
      - ./session_state.json:/app/session_state.json
    ports:
      - "127.0.0.1:8000:8000"
    networks:
      - sentitrack-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sentitrack-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - sentitrack-net

networks:
  sentitrack-net:
    driver: bridge

volumes:
  x_session_data:
