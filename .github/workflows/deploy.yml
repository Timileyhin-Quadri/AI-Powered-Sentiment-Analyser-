name: SentiTrack CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ============================================================
  # Stage 1: Build & Verify (CI)
  # ============================================================
  build-and-test:
    name: Build & Verify (CI)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Backend Imports
        run: |
          python -c "from backend.main import app; print('Backend loaded successfully. Routes:', len(app.routes))"
          python -c "from backend.scraper import scrape_topic; print('Scraper module valid')"

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies & Build
        working-directory: frontend
        run: |
          npm ci
          npm run build

  # ============================================================
  # Stage 2: Deploy to Azure Linux VM (CD)
  # ============================================================
  deploy:
    name: Deploy to Azure VM (CD)
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH to Azure VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AZURE_VM_IP }}
          username: ${{ secrets.AZURE_VM_USER }}
          key: ${{ secrets.AZURE_SSH_PRIVATE_KEY }}
          port: 22
          timeout: 180s
          script: |
            set -e
            echo "==> Starting SentiTrack deployment on Azure VM..."

            APP_DIR="/opt/sentitrack"

            # 1. Sync repository code
            sudo mkdir -p $APP_DIR
            sudo chown -R $USER:$USER $APP_DIR
            cd $APP_DIR

            if [ ! -d ".git" ]; then
              echo "==> Initializing repository in $APP_DIR..."
              git init
            fi

            echo "==> Syncing latest changes from main..."
            git remote remove origin 2>/dev/null || true
            git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
            git fetch origin main
            git checkout -f -B main origin/main
            git remote set-url origin "https://github.com/${{ github.repository }}.git"

            # 2. Ensure session and environment files exist
            touch cookies.json session_state.json

            # 3. Inject production .env if provided in GitHub Secrets
            if [ -n "${{ secrets.PROD_ENV }}" ]; then
              echo "${{ secrets.PROD_ENV }}" > .env
              echo "==> Injected production .env configuration."
            fi

            # 4. Build and start containers with Docker Compose
            echo "==> Rebuilding and restarting containers..."
            DOCKER_CMD="docker compose"
            if ! docker compose version >/dev/null 2>&1; then
              if command -v docker-compose >/dev/null 2>&1; then
                DOCKER_CMD="docker-compose"
              else
                DOCKER_CMD="sudo docker compose"
              fi
            fi

            $DOCKER_CMD down --remove-orphans || true
            $DOCKER_CMD up -d --build

            # 5. Clean up stale/dangling Docker images to save disk space
            docker image prune -f || sudo docker image prune -f || true

            # 6. Verify health check
            echo "==> Verifying deployment health..."
            HEALTHY=false
            for i in $(seq 1 10); do
              if curl -s -f http://localhost/api/health > /dev/null; then
                HEALTHY=true
                echo "==> Health check passed!"
                break
              fi
              echo "Waiting for services to become ready... ($i/10)"
              sleep 3
            done

            if [ "$HEALTHY" != "true" ]; then
              echo "Health check failed! Checking logs:"
              $DOCKER_CMD logs --tail=50
              exit 1
            fi

            echo "==> Deployment completed successfully!"

